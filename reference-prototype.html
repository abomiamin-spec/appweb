:root[data-theme=dark]{--bg:#080D18;--bg2:#101827;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.12);--tx:#F4F7FC;--tx2:#A4B0C2;--p:#69B7FF;--v:#9B8CFF;--ok:#39C98A;--sh:0 8px 30px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 'IBM Plex Sans Arabic',Inter,system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(60vw 50vh at 85% -5%,color-mix(in srgb,var(--p) 28%,transparent),transparent),radial-gradient(50vw 50vh at 5% 30%,color-mix(in srgb,var(--v) 22%,transparent),transparent);background-attachment:fixed}
[lang=en] body{font-family:Inter,'IBM Plex Sans Arabic',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:12px auto 0;max-width:1120px;padding:0 20px}
header .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-inline-end:auto}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--p)}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--tx2);line-height:1.2}
nav{display:flex;gap:2px}
nav a{padding:6px 14px;border-radius:999px;color:var(--tx2);font-size:14px}
nav a.on,nav a:hover{background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--tx)}
.ib{border:1px solid var(--bd);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px}
.menu{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font-weight:500;background:linear-gradient(135deg,var(--p),var(--v));color:#fff}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{padding:64px 0 28px;max-width:720px}
h1{font-size:clamp(34px,6vw,60px);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
.hero p{color:var(--tx2);margin:0 0 22px;max-width:560px}
.search{display:flex;gap:8px;padding:8px;border-radius:16px;max-width:560px}
.search input,.f input,.f select,.f textarea{flex:1;background:transparent;border:0;color:var(--tx);font:inherit;padding:8px 10px;min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--bd);border-radius:10px;width:100%;background:var(--bg2)}
.count{margin-top:12px;color:var(--tx2);font-size:14px}
section{margin:44px 0}
h2{font-size:24px;margin:0 0 16px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:24px;padding:28px;align-items:center}
.feat .ic{width:112px;height:112px;font-size:44px}
.ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--p),var(--v));flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--p)}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--tx2);font-size:14px;flex:1}
.row{display:flex;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--p) 16%,transparent);color:var(--p)}
.demo{background:color-mix(in srgb,#e8a317 22%,transparent);color:#b97d00}
.muted{color:var(--tx2);font-size:14px}
.f{display:grid;gap:12px;padding:22px;max-width:640px}
.f label{display:grid;gap:4px;font-size:14px;color:var(--tx2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{display:grid;gap:12px}
.tl .glass{padding:16px 18px}
.empty{padding:40px;text-align:center;color:var(--tx2)}
.portrait{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--p);box-shadow:var(--sh)}
.about{display:flex;gap:24px;align-items:center;padding:28px}
footer{margin-top:60px;padding:28px 0;border-top:1px solid var(--bd);color:var(--tx2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.notice{padding:18px 20px;border-radius:14px;border:1px solid #e8a317;background:color-mix(in srgb,#e8a317 14%,transparent);margin-bottom:18px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;padding:10px 18px;border-radius:12px;z-index:30}
@media(max-width:760px){nav{display:none;position:absolute;top:64px;inset-inline:20px;flex-direction:column;padding:10px;border-radius:18px;background:var(--bg2);border:1px solid var(--bd)}nav.open{display:flex}.menu{display:inline-block}.feat{grid-template-columns:1fr}.about{flex-direction:column;text-align:center}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== State ===== */
const S={lang:"ar",theme:"",q:"",cat:"all",plat:"all",sort:"new"};
try{S.lang=localStorage.getItem("yj-lang")||"ar";S.theme=localStorage.getItem("yj-theme")||""}catch(e){}
const $=s=>document.querySelector(s),t=k=>T[S.lang][k],L=o=>o?(o[S.lang]||o.ar):"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString(S.lang==="ar"?"ar-IQ":"en-GB",{year:"numeric",month:"short",day:"numeric"});
const pub=()=>DATA.apps.filter(a=>a.published);
const catName=id=>{const c=DATA.categories.find(c=>c.id===id);return c?c[S.lang]:id};
const icon=(a,c="")=>`<div class="ic ${c}" aria-hidden="true">${esc(L(a.name).trim().charAt(0).toUpperCase())}</div>`;
const plats=a=>Object.keys(a.platforms).filter(k=>a.platforms[k].enabled);
const pTag=a=>plats(a).map(p=>`<span class="tag">${{android:"Android",windows:"Windows",web:"Web"}[p]}</span>`).join("");
function card(a){return `<article class="glass card"><div class="row">${icon(a)}<div><h3>${esc(L(a.name))}</h3><span class="muted">${catName(a.category)} · v${esc(a.version)}</span></div></div><p>${esc(L(a.description))}</p><div class="chips"><span class="tag demo">${t("demo")}</span>${pTag(a)}</div><a class="btn g" href="#app-${a.slug}">${t("details")}</a></article>`}
function dl(a){return plats(a).map(p=>{const pl=a.platforms[p],u=p==="web"?pl.url:pl.downloadUrl;return u?`<a class="btn" href="${esc(u)}" rel="noopener">${t(p)}</a>`:`<button class="btn" disabled title="${t("demoN")}">${t(p)}</button>`}).join("")}
/* ===== Views ===== */
function home(){const ps=pub(),f=ps.find(a=>a.featured),by=k=>[...ps].sort((a,b)=>b[k].localeCompare(a[k])).slice(0,3);
return `<div class="hero"><h1>${t("h1")}</h1><p>${t("sub")}</p><form class="glass search" onsubmit="event.preventDefault();S.q=this.q.value;go('apps')"><input name="q" placeholder="${t("ph")}" aria-label="${t("ph")}"><button class="btn">${t("browse")}</button></form><div class="count">${ps.length} ${t("published")}</div></div>
${f?`<section><h2>${t("feat")}</h2><div class="glass feat">${icon(f,"")}<div><h3 style="font-size:28px;margin:0">${esc(L(f.name))}</h3><p class="muted">${esc(L(f.description))}</p><div class="chips" style="margin-bottom:14px"><span class="tag">v${esc(f.version)}</span><span class="tag">${catName(f.category)}</span>${pTag(f)}</div><div class="chips"><a class="btn g" href="#app-${f.slug}">${t("details")}</a>${dl(f)}</div></div></div></section>`:""}
<section><h2>${t("cats")}</h2><div class="chips">${DATA.categories.map(c=>`<a class="chip" href="#apps" onclick="S.cat='${c.id}'">${c[S.lang]}</a>`).join("")}</div></section>
<section><h2>${t("latest")}</h2><div class="grid">${by("releaseDate").map(card).join("")}</div></section>
<section><h2>${t("recent")}</h2><div class="grid">${by("updatedAt").map(card).join("")}</div></section>
<section>${aboutBox()}</section>`}

function apps(){let r=pub().filter(a=>(S.cat==="all"||a.category===S.cat)&&(S.plat==="all"||a.platforms[S.plat].enabled)&&(L(a.name)+L(a.description)).toLowerCase().includes(S.q.toLowerCase()));
r.sort((a,b)=>S.sort==="az"?L(a.name).localeCompare(L(b.name)):S.sort==="upd"?b.updatedAt.localeCompare(a.updatedAt):b.releaseDate.localeCompare(a.releaseDate));
const ch=(k,v,l)=>`<button class="chip ${S[k]===v?"on":""}" onclick="S.${k}='${v}';draw()">${l}</button>`;
return `<section><h2>${t("apps")}</h2><div class="glass search" style="margin-bottom:14px"><input id="q" value="${esc(S.q)}" placeholder="${t("ph")}" aria-label="${t("ph")}" oninput="S.q=this.value;redraw()"></div>
<div class="chips" style="margin-bottom:10px">${ch("cat","all",t("all"))}${DATA.categories.map(c=>ch("cat",c.id,c[S.lang])).join("")}</div>
<div class="chips" style="margin-bottom:10px"><span class="muted">${t("sys")}:</span>${ch("plat","all",t("all"))}${ch("plat","android","Android")}${ch("plat","windows","Windows")}${ch("plat","web","Web")}</div>
<div class="chips" style="margin-bottom:20px"><span class="muted">${t("sort")}:</span>${ch("sort","new",t("s_new"))}${ch("sort","upd",t("s_upd"))}${ch("sort","az",t("s_az"))}<button class="chip" onclick="S.q='';S.cat='all';S.plat='all';S.sort='new';draw()">${t("clear")}</button></div>
<div id="res">${res(r)}</div></section>`}
const res=r=>r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="glass empty">${t("none")}</div>`;
function redraw(){/* live search without losing input focus */const r=pub().filter(a=>(S.cat==="all"||a.category===S.cat)&&(S.plat==="all"||a.platforms[S.plat].enabled)&&(L(a.name)+L(a.description)).toLowerCase().includes(S.q.toLowerCase()));$("#res").innerHTML=res(r)}
function detail(slug){const a=pub().find(x=>x.slug===slug);if(!a)return nf();
return `<section><a class="muted" href="#apps">${S.lang==="ar"?"→":"←"} ${t("back")}</a><div class="glass feat" style="margin-top:12px">${icon(a)}<div><h1 style="font-size:34px;margin:0">${esc(L(a.name))}</h1><div class="chips" style="margin:8px 0"><span class="tag demo">${t("demo")}</span><span class="tag">${catName(a.category)}</span></div><p class="muted">${esc(L(a.description))}</p><div class="chips">${dl(a)}</div></div></div>
<div class="grid" style="margin-top:16px"><div class="glass card"><h3>${t("ver")}</h3><p>v${esc(a.version)} · ${fmt(a.releaseDate)}<br>${t("upd")}: ${fmt(a.updatedAt)}${a.size?`<br>${t("size")}: ${esc(a.size)}`:""}</p></div>
<div class="glass card"><h3>${t("plat")}</h3><div class="chips">${pTag(a)}</div></div>
<div class="glass card"><h3>${t("req")}</h3><p>${(L(a.requirements)||[]).map(esc).join("<br>")}</p></div></div>
<h2 style="margin-top:32px">${t("log")}</h2><div class="tl">${a.changelog.map(c=>`<div class="glass"><b>v${esc(c.version)}</b> <span class="tag">${t("type")[c.type]||c.type}</span> <span class="muted">${fmt(c.date)}</span><div>${esc(L(c.notes))}</div></div>`).join("")}</div></section>`}
function updates(){const u=pub().flatMap(a=>a.changelog.map(c=>({a,c}))).sort((x,y)=>y.c.date.localeCompare(x.c.date));
return `<section><h2>${t("updates")}</h2><div class="tl">${u.map(({a,c})=>`<div class="glass"><div class="row"><b>${esc(L(a.name))}</b><span class="tag">v${esc(c.version)}</span><span class="tag">${t("type")[c.type]||c.type}</span><span class="muted">${fmt(c.date)}</span></div><div>${esc(L(c.notes))}</div><a class="muted" href="#app-${a.slug}">${t("details")}</a></div>`).join("")}</div></section>`}
function about(){return `<section>${aboutBox()}<div class="grid" style="margin-top:16px"><div class="glass card"><h3>${t("vis")}</h3><p>${L(DATA.settings.vision)}</p></div><div class="glass card"><h3>${t("contact")}</h3><p>${DATA.settings.github?`<a href="${esc(DATA.settings.github)}">GitHub</a>`:"GitHub: —"}</p></div></div></section>`}
function admin(){return `<section><h2>${t("admin")}</h2><div class="notice"><b>${t("anTitle")}</b><p style="margin:6px 0 0">${t("anBody")}</p></div><button class="btn" disabled>${t("lg")}</button><h3 style="margin-top:28px">${t("preview")}</h3><fieldset disabled style="border:0;padding:0;margin:0"><div class="glass f"><div class="two"><label>${t("nAr")}<input></label><label>${t("nEn")}<input></label></div><div class="two"><label>${t("dAr")}<textarea rows="2"></textarea></label><label>${t("dEn")}<textarea rows="2"></textarea></label></div><label>${t("cat")}<select>${DATA.categories.map(c=>`<option>${c[S.lang]}</option>`).join("")}</select></label><label>${t("ver")}<input placeholder="1.0.0"></label><label>${t("url")}<input dir="ltr" placeholder="https://github.com/…/releases/…"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto"> ${t("feat2")}</label><button class="btn">${t("save")}</button></div></fieldset></section>`}
function nf(){return `<div class="glass empty" style="margin-top:40px">404 — ${t("nf")}<br><a class="btn" style="margin-top:12px" href="#home">${t("home")}</a></div>`}
/* ===== Router & chrome ===== */
const go=h=>{location.hash=h};
function draw(){const h=(location.hash.slice(1)||"home");let v;
if(h==="home")v=home();else if(h==="apps")v=apps();else if(h==="updates")v=updates();else if(h==="about")v=about();else if(h==="admin")v=admin();else if(h.startsWith("app-"))v=detail(h.slice(4));else v=nf();
$("#app").innerHTML=v;
const el=document.documentElement;el.lang=S.lang;el.dir=S.lang==="ar"?"rtl":"ltr";if(S.theme)el.dataset.theme=S.theme;else delete el.dataset.theme;
document.querySelectorAll("[data-t]").forEach(n=>n.textContent=t(n.dataset.t));
$("#nav").innerHTML=["home","apps","updates","about"].map(k=>`<a href="#${k}" class="${h===k?"on":""}">${t(k)}</a>`).join("");
$("#nav").classList.remove("open");$("#lang").textContent=S.lang==="ar"?"EN":"عربي";
const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;$("#theme").textContent=dark?"☀":"☾";
$("#foot").textContent=t("rights");
document.title=h.startsWith("app-")&&pub().find(a=>a.slug===h.slice(4))?L(pub().find(a=>a.slug===h.slice(4)).name)+" | "+t("name"):t("name")+" | "+t("store");}
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";try{localStorage.setItem("yj-lang",S.lang)}catch(e){}draw()};
$("#theme").onclick=()=>{const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dark?"light":"dark";try{localStorage.setItem("yj-theme",S.theme)}catch(e){}draw()};
$("#menu").onclick=()=>$("#nav").classList.toggle("open");
addEventListener("hashchange",()=>{draw();scrollTo(0,0)});
draw();
</script>
</body>
</html>
